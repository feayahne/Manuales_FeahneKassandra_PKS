<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment</title>
    <link rel="stylesheet" href="payment.css">
</head>
<body>
    <div class="nav">
        <div class="nav-left">
            <div class="nav-item"><a href="dashboard.html">Dashboard</a></div>
            <div class="nav-item"><a href="booking.html">Booking</a></div>
            <div class="nav-item"><a href="checkin.html">Check in</a></div>
            <div class="nav-item"><a href="checkout.html">Check out</a></div>
            <div class="nav-item"><a href="about.html">About us</a></div>
        </div>
        <div class="nav-right">
            <div class="nav-item"><a href="landingPage.html">Log out</a></div>
        </div>
    </div>
    <div class="wrap">
        <div class="wrapper">
            <div class="booking-details-wrapper">
                <div class="booking-details">
                    <h2 class="booking_details">Booking Details</h2>
                    <p class="item">Number of guests</p> <p class="item" id="numberGuests">_</p>
                    <p class="item">Room No.</p> <p class="item" id="roomNumber">_</p>
                    <p class="item">Room type</p> <p class="item" id="roomType">_</p>
                    <p class="item">Check-in date</p> <p class="item" id="checkInDate">_</p>
                    <p class="item">Check-out date</p> <p class="item" id="checkOutDate">_</p>
                    <p class="item">Total days</p> <p class="item" id="totalDays">_</p>
                </div>
            </div>
            <div class="box-container">
                <div class="check-out-summary">
                    <h2 class="check-out">Check-out Summary</h2>
                    <p class="item">Total Room price (Room price x Days)</p> <p class="item" id="totalRoomPrice">_</p>
                    <p class="item">Platform fee</p> <p class="item" id="platformFee">_</p>
                    <p class="item">Service fee</p> <p class="item" id="serviceFee">_</p>
                    <p class="item">Total</p> <p class="item" id="totalPrice">_</p>
                </div>
                <hr>
                <div class="payment-method">
                    <h2>Selected Payment Method</h2>
                    <select id="paymentMode">
                        <option value="Credit Card">Credit Card</option>
                        <option value="PayPal">PayPal</option>
                        <option value="Bank Transfer">Bank Transfer</option>
                        <option value="Cash">Cash</option>
                    </select>
                </div>
                <hr>
            </div>
        </div>
        <form action="">
            <button id="confirm-payment">Confirm Payment</button>
            <button id="backToBooking">Back</button>
        </form>
    </div>
    <script src="payment.js"></script>
</body>
</html>
